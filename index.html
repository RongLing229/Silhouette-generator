<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silhouette Blockout Studio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="control-panel">
        <header class="panel-header">
          <p class="eyebrow">Character concept tool</p>
          <h1>Silhouette Blockout</h1>
          <p class="intro">Generate a strong, simple foundation to paint over and develop.</p>
        </header>

        <fieldset class="control-group">
          <legend>Shape language</legend>
          <p class="group-hint">Weights blend into one consistent visual direction.</p>

          <label class="shape-row">
            <span class="shape-choice">
              <input type="checkbox" id="shapeCircle" checked>
              <span>Circle</span>
            </span>
            <input type="number" id="weightCircle" class="shape-weight" value="1" min="0" max="10" aria-label="Circle weight">
          </label>

          <label class="shape-row">
            <span class="shape-choice">
              <input type="checkbox" id="shapeSquare" checked>
              <span>Square</span>
            </span>
            <input type="number" id="weightSquare" class="shape-weight" value="1" min="0" max="10" aria-label="Square weight">
          </label>

          <label class="shape-row">
            <span class="shape-choice">
              <input type="checkbox" id="shapeTriangle" checked>
              <span>Triangle</span>
            </span>
            <input type="number" id="weightTriangle" class="shape-weight" value="1" min="0" max="10" aria-label="Triangle weight">
          </label>

          <div class="language-options">
            <label class="select-row" for="shapeIntensity">
              <span>Shape Intensity</span>
              <select id="shapeIntensity">
                <option value="0.55">Low</option>
                <option value="1" selected>Medium</option>
                <option value="1.45">High</option>
              </select>
            </label>

            <label class="select-row" for="massBias">
              <span>Mass Bias</span>
              <select id="massBias">
                <option value="top">Top Heavy</option>
                <option value="balanced" selected>Balanced</option>
                <option value="bottom">Bottom Heavy</option>
              </select>
            </label>

            <label class="select-row" for="taperDirection">
              <span>Taper Direction</span>
              <select id="taperDirection">
                <option value="top">Wider at Top</option>
                <option value="neutral" selected>Neutral</option>
                <option value="bottom">Wider at Bottom</option>
              </select>
            </label>
          </div>
        </fieldset>

        <fieldset class="control-group">
          <legend>Proportions</legend>

          <div class="proportion-control">
            <div class="proportion-heading">
              <label for="heightControl">Height</label>
              <span id="heightDescription" class="proportion-description">Neutral</span>
            </div>
            <div class="proportion-inputs">
              <input type="range" id="heightControl" value="1" min="0.60" max="1.40" step="0.05" aria-describedby="heightDescription">
              <input type="number" id="heightValue" class="proportion-number" value="1.00" min="0.30" max="2.00" step="0.05" aria-label="Precise height value">
            </div>
          </div>

          <div class="proportion-control">
            <div class="proportion-heading">
              <label for="bodyWidthControl">Body Mass</label>
              <span id="bodyMassDescription" class="proportion-description">Neutral</span>
            </div>
            <div class="proportion-inputs">
              <input type="range" id="bodyWidthControl" value="1" min="0.60" max="1.40" step="0.05" aria-describedby="bodyMassDescription">
              <input type="number" id="bodyMassValue" class="proportion-number" value="1.00" min="0.30" max="2.00" step="0.05" aria-label="Precise body mass value">
            </div>
          </div>

          <div class="proportion-control">
            <div class="proportion-heading">
              <label for="shoulderControl">Shoulder Width</label>
              <span id="shoulderDescription" class="proportion-description">Neutral</span>
            </div>
            <div class="proportion-inputs">
              <input type="range" id="shoulderControl" value="1" min="0.60" max="1.40" step="0.05" aria-describedby="shoulderDescription">
              <input type="number" id="shoulderValue" class="proportion-number" value="1.00" min="0.30" max="2.00" step="0.05" aria-label="Precise shoulder width value">
            </div>
          </div>

          <button id="randomiseProportions" class="secondary-button" type="button">Randomise Proportions</button>
        </fieldset>

        <div class="display-options">
          <label class="debug-row" for="debugRegions">
            <input type="checkbox" id="debugRegions">
            <span>Show construction</span>
          </label>
          <label class="debug-row" for="editPose">
            <input type="checkbox" id="editPose">
            <span>Edit Pose</span>
          </label>
        </div>

        <button id="generateButton" class="primary-button" type="button">Generate Silhouette</button>
      </aside>

      <section class="workspace" aria-label="Silhouette workspace">
        <header class="workspace-header">
          <div>
            <p class="eyebrow">Canvas</p>
            <h2>Single blockout</h2>
          </div>
          <span class="canvas-size">600 × 700</span>
        </header>

        <div class="canvas-stage">
          <canvas id="drawCanvas" width="600" height="700" aria-label="Generated full-body silhouette"></canvas>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
